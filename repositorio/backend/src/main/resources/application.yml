app:
  uploads:
    path: ./uploads

spring:
  application:
    name: huellas-santa-marta-backend
  
  datasource:
    url: jdbc:postgresql://localhost:5432/huellas_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: false

server:
  servlet:
    context-path: /api
  port: 8080

logging:
  level:
    root: INFO
    com.huellas: DEBUG
    org.springframework.web: DEBUG
